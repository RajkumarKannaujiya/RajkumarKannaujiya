<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="End card: an arcade intermission, a ghost chasing the chomper and then a giant chomper chasing the ghost back. Then the sign-off: Let’s build thoughtful AI. Game on!, Rajkumar Kannaujiya.">
<style>
.a1{animation:a1 1.7s linear 0.25s both}
.a1g{animation:a1 1.7s linear 0.35s both}
.a2{animation:a2 1.6s linear 2.19s both}
.a2g{animation:a2g 1.6s linear 2.05s both}
.write{animation:write 1.25s linear 3.75s both}
.reveal{transform-box:fill-box;transform-origin:left center;animation:grow 1.25s linear 3.75s both}
.rise{animation:rise .8s cubic-bezier(0.16, 1, 0.3, 1) both}
.boot{animation:fade .6s ease-out both}
.flip{animation-name:flip;animation-iteration-count:infinite}
.jaw{animation:chomp .24s ease-in-out infinite}
@keyframes a1{from{transform:translate(1260px,150px)}}
@keyframes a2{from{transform:translate(-200px,140px)}}
@keyframes a2g{from{transform:translate(-40px,150px)}}
@keyframes write{from{transform:translate(131.1px,89.3px)}}
@keyframes fade{from{opacity:0}}
@keyframes held{from{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
@keyframes grow{from{transform:scaleX(0)}}
@keyframes crt{from{transform:scaleY(.004)}}
@keyframes pop{from{transform:scale(0)}}
@keyframes draw{from{stroke-dashoffset:1}}
@keyframes flip{0%,49.9%{opacity:1}50%,100%{opacity:0}}
@keyframes chomp{50%{transform:rotate(0deg)}}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }</style>
