name: Refresh profile card

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v7

      - name: Refresh live GitHub statistics
        run: python3 scripts/build_profile_card.py

      - name: Commit updated profile card
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dark_mode.svg light_mode.svg
          if git diff --cached --quiet; then
            echo "Profile statistics are already current."
            exit 0
          fi
          git commit -m "Refresh profile card statistics"
          git push
